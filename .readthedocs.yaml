 version: 2

 build:
   os: ubuntu-24.04
   tools:
     python: latest
   apt_packages:
     - aria2
     - tar
   jobs:
     # For reproducible builds, install with uv:
     # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
     install:
       - pip install zensical
       - aria2c -x2 'https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz' -o t.tar.xz
       - tar -xf t.tar.xz
       - mv typst-x86_64-unknown-linux-musl/ third/
       - ./third/typst c example.typ docs/example.svg
       - rm t.tar.xz
     build:
       html:
         - zensical build
     post_build:
       # Copy the built site into the directory Read the Docs publishes.
       - mkdir -p $READTHEDOCS_OUTPUT/html/
       - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
